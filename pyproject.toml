[project]
name = "rl-frozenlake"
version = "0.2.0"
description = "Utilities for exploring reinforcement learning on the FrozenLake task."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "rl-frozenlake maintainers" }
]
dependencies = [
  "gymnasium>=0.29.1,<0.30",
  "matplotlib>=3.8,<3.9",
  "numpy>=1.26,<2",
]

[project.scripts]
rl-frozenlake = "frozenlake1:main"

[tool.uv]
dev-dependencies = []
